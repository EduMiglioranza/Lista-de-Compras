<head>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">

<body>

                <button type="submit">Adicionar item</button>
            </form>
    
            <ul>

                    </label>
                    <p>Pão de forma</p>
                    <a href="#">
                        <img src="./assets/Trash.svg" alt="icone de lixo para excluir elemento da lista." class="remove">
                    </a>
                </li>
                -->

            <div class="alert">
                <img src="./assets/warning.svg" alt="Icone de alerta.">
